<!-- ============================================
     partials/modals.html
     Modais: Primeiro Acesso, Crachá, Genérico
     Parte do sistema HRPI — injetada em #modalsContainer por js/00-partials-loader.js
     ============================================ -->
    <!-- MODAL PRIMEIRO ACESSO -->
    <div id="firstAccessModal" class="modal-overlay" style="display: none;">
        <div class="modal" style="max-width: 450px;">
            <button class="modal-close" onclick="document.getElementById('firstAccessModal').style.display='none'">&times;</button>
            <h3><i class="fas fa-key"></i> Primeiro Acesso - Criar Nova Senha</h3>
            <p style="margin-bottom: 16px; font-size: 13px; color: var(--text-light);">
                Por segurança, você precisa criar uma senha pessoal antes de continuar.
            </p>
            
            <form id="changePasswordForm" autocomplete="off">
                <div class="form-group" style="margin-bottom: 14px;">
                    <label>Nova Senha <span class="required">*</span></label>
                    <input type="password" id="newPassword" placeholder="Mínimo 6 caracteres" required minlength="6" autocomplete="new-password">
                </div>
                <div class="form-group" style="margin-bottom: 14px;">
                    <label>Confirmar Senha <span class="required">*</span></label>
                    <input type="password" id="confirmPassword" placeholder="Repita a nova senha" required minlength="6" autocomplete="new-password">
                </div>
                <div id="passwordError" class="login-error" style="display: none;"></div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    <i class="fas fa-save"></i> Salvar e Acessar
                </button>
            </form>
        </div>
    </div>

    <!-- MODAL DE CRACHÁ -->
    <div id="badgeModal" class="modal-overlay" style="display: none;">
        <div class="modal" style="max-width: 400px; padding: 0; overflow: hidden;">
            <div style="display: flex; justify-content: flex-end; padding: 8px 12px; background: var(--bg);">
                <button class="btn btn-sm btn-primary" onclick="imprimirCracha()" style="margin-right: 8px;">
                    <i class="fas fa-print"></i> Imprimir
                </button>
                <button class="modal-close" onclick="document.getElementById('badgeModal').style.display='none'" style="position: static;">&times;</button>
            </div>
            <div id="badgeContent" style="padding: 24px; background: #fff; color: #000; text-align: center;">
            </div>
        </div>
    </div>

    <!-- MODAL GENÉRICO -->
    <div id="genericModal" class="modal-overlay">
        <div class="modal">
            <button class="modal-close" onclick="fecharModal()">&times;</button>
            <h3 id="modalTitle">Título</h3>
            <div id="modalBody"></div>
        </div>
    </div>
