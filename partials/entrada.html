<!-- ============================================
     partials/entrada.html
     Formulário de Entrada de Acompanhante
     Parte do sistema HRPI — injetada em #pagesContainer por js/00-partials-loader.js
     ============================================ -->
            <div id="entradaAcompanhante" class="page">
                <div class="page-header">
                    <h1><i class="fas fa-user-plus"></i> Entrada de Acompanhante</h1>
                    <p class="breadcrumb">Registrar novo acompanhante no sistema</p>
                </div>
                <div class="card">
                    <div class="card-header">
                        <h3><i class="fas fa-clipboard-list"></i> Formulário de Entrada</h3>
                    </div>
                    <form id="formEntradaAcompanhante">
                        <div class="form-grid">
                            <div class="form-group"><label>Nome do Acompanhante <span class="required">*</span></label><input type="text" id="acNome" placeholder="Nome completo" required></div>
                            <div class="form-group"><label>Documento</label><input type="text" id="acDocumento" placeholder="RG, CPF ou outro"></div>
                            <div class="form-group"><label>Telefone</label><input type="tel" id="acTelefone" placeholder="(00) 00000-0000"></div>
                            <div class="form-group"><label>Parentesco <span class="required">*</span></label><select id="acParentesco" required><option value="">Selecione...</option><option>Filho(a)</option><option>Pai/Mãe</option><option>Cônjuge</option><option>Irmão/Irmã</option><option>Neto(a)</option><option>Sobrinho(a)</option><option>Amigo(a)</option><option>Cuidador(a)</option><option>Outro</option></select></div>
                            <div class="form-group" style="position: relative;">
                                <label>Nome do Paciente <span class="required">*</span></label>
                                <input type="text" id="acPaciente" placeholder="Nome do paciente" required autocomplete="off">
                                <div class="sugestoes-paciente" id="sugestoesAcPaciente"></div>
                            </div>
                            <div class="form-group"><label>Setor <span class="required">*</span></label><select id="acSetor" required><option value="">Selecione...</option><option>Oncologia I</option><option>Oncologia II</option><option>Clínica Médica I</option><option>Clínica Médica II</option><option>Clínica Cirúrgica</option><option>Pediatria</option><option>Saúde Mental</option></select><small style="color: var(--text-light); display:block; margin-top:4px;">UTI I e UTI II não aparecem aqui — esses setores permitem apenas visita (veja "Registro de Visita").</small></div>
                            <div class="form-group"><label>Leito</label><input type="text" id="acLeito" placeholder="Número do leito"></div>
                            <div class="form-group"><label>Observação</label><textarea id="acObservacao" rows="2" placeholder="Informações adicionais..."></textarea></div>
                        </div>
                        <div class="form-actions"><button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Registrar Entrada</button></div>
                    </form>
                </div>
            </div>

            <!-- REGISTRO DE VISITA -->
